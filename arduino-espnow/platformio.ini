; PlatformIO Arduino ESP-NOW button/LED test (minimal)
[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@6.6.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps = 
    fastled/FastLED@^3.7.0

build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DLED_PIN=48
    -DBUTTON_PIN=0
    -DESPNOW_CHANNEL=1
    -DESPNOW_GROUP=1
