; ESP32-S3 ESP-NOW button -> RGB LED link test
;
; Flash the same firmware to both boards. No router, pairing step, or
; per-unit configuration is required.

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = espidf

; PlatformIO 8 defaults to ESP-IDF 6.1, whose default toolchain is GCC 15.2.
; Pin ESP-IDF 5.5.5 and the GCC 14.2 toolchain it was built with. ESP-IDF's
; tools/tools.json for v5.5.5 lists 14.2.0+20260121 for both toolchains.
platform_packages =
    platformio/framework-espidf@4.50505.0
    platformio/toolchain-riscv32-esp@14.2.0+20260121
    platformio/toolchain-xtensa-esp-elf@14.2.0+20260121

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800

build_flags =
    -DAPP_BUTTON_GPIO=0
    -DAPP_RGB_GPIO=48
    -DAPP_ESPNOW_CHANNEL=1
    -DAPP_ESPNOW_GROUP=1
    -DAPP_LED_BRIGHTNESS=32
    -Wall
    -Wextra
